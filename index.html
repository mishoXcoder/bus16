  .amb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,9,15,.88) 0, rgba(6,9,15,.2) 36%, rgba(6,9,15,.55) 62%, rgba(6,9,15,.97) 90%); }

  /* ---------- header ---------- */
  .top {
    position: absolute; z-index: 5; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between;
    padding: calc(16px + env(safe-area-inset-top)) 18px 0;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .mark { width: 38px; height: 38px; border-radius: 11px; background: var(--amber); color: #1a1205; display: grid; place-items: center; font-weight: 700; font-size: 18px; letter-spacing: -.5px; }
  .brand b { display: block; font-size: 19px; font-weight: 700; line-height: 1.15; }
  .brand small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); }
  .tag { font-size: 11.5px; color: var(--muted); padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); }

  /* ---------- the bus ---------- */
  .hero { position: absolute; left: 0; right: 0; z-index: 2; }
  .stage { position: absolute; left: 50%; top: 0; width: 390px; height: 290px; margin-left: -195px; transform-origin: 50% 0; }
  .busart { position: absolute; left: 0; top: 0; width: 390px; height: 290px; -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 9%, #000 86%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 9%, #000 86%, transparent 100%); }
  .busart img { display: block; width: 390px; height: 100%; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%); }
  .hs { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: block; overflow: hidden; }

  /* windshield screen */
  .led { background: rgba(4,6,12,.93); border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(244,166,42,.38), inset 0 0 14px rgba(244,166,42,.12); }
  .led .tagad { position: absolute; z-index: 2; left: 6px; bottom: 5px; font-size: 8px; line-height: 1; color: rgba(255,255,255,.55); }
  .slide { position: absolute; inset: 0; display: flex; align-items: center; gap: 9px; padding: 0 11px; opacity: 0; transform: translateY(6px); transition: opacity .5s ease, transform .5s ease; }
  .slide.on { opacity: 1; transform: none; }
  .slide .ico { flex: none; width: 33px; height: 33px; border-radius: 8px; background: rgba(244,166,42,.14); color: var(--amber); display: grid; place-items: center; }
  .slide small { display: block; font-size: 9.5px; color: var(--amber-soft); white-space: nowrap; line-height: 1.3; }
  .slide b { display: block; font-size: 16px; font-weight: 700; line-height: 1.2; color: #fff; white-space: nowrap; }
  .slide i { display: block; font-style: normal; font-size: 9.5px; color: rgba(255,255,255,.55); white-space: nowrap; line-height: 1.3; }

  /* news strip on the black band */
  .news { display: flex; background: #05070d; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .news .alert { flex: none; display: grid; place-items: center; padding: 0 9px; background: var(--red); font-size: 11px; font-weight: 700; color: #fff; }
  .crawl { position: relative; flex: 1; overflow: hidden; }
  .track { position: absolute; top: 50%; left: 0; transform: translate(-100%, -50%); white-space: nowrap; font-size: 12px; font-weight: 500; animation: crawl var(--dur, 18s) linear infinite; }
  @keyframes crawl { from { left: 0; transform: translate(-100%, -50%); } to { left: 100%; transform: translate(0, -50%); } }

  /* game plaque on the grille */
  .game { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 9px; background: linear-gradient(180deg, #0a0e18, #04060b); border-radius: 4px;
    box-shadow: inset 0 0 0 1px rgba(244,166,42,.6), inset 0 0 12px rgba(244,166,42,.14); }
  .game .l1 { display: flex; align-items: center; gap: 5px; color: var(--amber-soft); font-size: 12.5px; font-weight: 700; line-height: 1.1; }
  .game .l2 { font-size: 8px; color: rgba(255,255,255,.72); line-height: 1.1; white-space: nowrap; }

  /* primary map button, sits on the side of the bus */
  .where {
    position: absolute; z-index: 6; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 13px 0 11px; border-radius: 99px;
    background: var(--amber); color: #1a1205; font-size: 15px; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.45);
  }
  .where svg { flex: none; }

  .hot { animation: flash 1.2s ease-out backwards; animation-delay: var(--d, 0s); }
  @keyframes flash {
    0% { box-shadow: 0 0 0 0 rgba(255,213,138,0); }
    35% { box-shadow: 0 0 0 3px rgba(255,213,138,.95), 0 0 20px rgba(255,213,138,.6); }
    100% { box-shadow: 0 0 0 0 rgba(255,213,138,0); }
  }
  .hint { position: absolute; left: 0; right: 0; text-align: center; margin: 0; font-size: 12.5px; color: var(--muted); }

  /* ---------- bottom dock ---------- */
  .dock { position: absolute; z-index: 4; left: 16px; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; gap: 10px; }
  .dbtn {
    display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 16px; border-radius: 15px;
    background: rgba(15,22,41,.9); border: 1px solid var(--line); box-shadow: 0 8px 22px rgba(0,0,0,.35);
    font-size: 15.5px; font-weight: 600; white-space: nowrap;
  }
  .dbtn svg { flex: none; color: var(--amber); }
  .dbtn.wide { flex: 1; }
  .dbtn .count { margin-inline-start: auto; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 99px; background: rgba(244,166,42,.16); color: var(--amber-soft); font-size: 12.5px; font-weight: 700; display: grid; place-items: center; }

  /* ---------- sheets ---------- */
  .veil { position: absolute; inset: 0; z-index: 20; background: rgba(3,5,12,.62); opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }
  .veil.open { opacity: 1; visibility: visible; transition: opacity .25s; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 82%; display: flex; flex-direction: column;
    background: var(--panel); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; box-shadow: 0 -14px 40px rgba(0,0,0,.5);
    transform: translateY(105%); visibility: hidden; transition: transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s .3s;
  }
  .sheet.open { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .grab { width: 38px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.22); margin: 9px auto 0; }
  .sheet header { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 2px; }
  .sheet h2 { margin: 0; font-size: 21px; font-weight: 700; line-height: 1.3; }
  .x { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.07); display: grid; place-items: center; color: var(--muted); }
  .body { overflow-y: auto; padding: 6px 20px calc(24px + env(safe-area-inset-bottom)); line-height: 1.75; color: rgba(238,241,247,.88); font-size: 15px; }
  .body p { margin: 0 0 10px; }
  .muted { color: var(--muted); font-size: 13px; }

  .row { display: flex; align-items: center; gap: 13px; width: 100%; min-height: 64px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .row:last-of-type { border-bottom: 0; }
  .tile { flex: none; width: 42px; height: 42px; border-radius: 11px; background: rgba(255,255,255,.06); color: var(--amber); display: grid; place-items: center; }
  .tile.big { width: 56px; height: 56px; border-radius: 15px; margin-bottom: 12px; }
  .row b { display: block; font-size: 16px; font-weight: 600; color: #fff; line-height: 1.35; }
  .row small { display: block; font-size: 13px; color: var(--muted); }
  .row .go { margin-inline-start: auto; color: rgba(255,255,255,.35); }
  .nrow { display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .nrow .dot { flex: none; width: 8px; height: 8px; margin-top: 10px; border-radius: 50%; background: var(--red); }
  .nrow b { display: block; font-weight: 600; color: #fff; }
  .chip { display: inline-block; font-size: 12.5px; padding: 2px 11px; border-radius: 99px; border: 1px solid var(--line); color: var(--amber-soft); margin-bottom: 12px; }
  .btn { display: block; width: 100%; height: 50px; margin-top: 14px; border-radius: 14px; background: var(--amber); color: #1a1205; font-weight: 700; font-size: 16px; text-align: center; line-height: 50px; }
  .btn.ghost { background: rgba(255,255,255,.07); color: #fff; font-weight: 600; }
  ul.plain { margin: 0 0 8px; padding: 0; list-style: none; }
  ul.plain li { padding: 6px 0; }
  ul.plain li::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-inline-end: 10px; border-radius: 50%; background: var(--amber); vertical-align: middle; }

  @media (prefers-reduced-motion: reduce) {
    .track { animation: none; position: static; transform: none; display: block; padding: 0 8px; line-height: 26px; overflow: hidden; text-overflow: ellipsis; }
    .hot { animation: none; }
    .slide, .sheet, .veil { transition: none; }
  }
</style>
</head>

   ========================================================== */
const app = $('app'), hero = $('hero'), stage = $('stage');
const GROUND = 272, STAGE_H = 290;
function fit() {
  const W = app.clientWidth, H = app.clientHeight;
  const s = Math.min(W / 390, 1.08);
  stage.style.transform = 'scale(' + s + ')';
  const top = Math.max(78, H * 0.46 - GROUND * s);
  hero.style.top = top + 'px';
  hero.style.height = (STAGE_H * s) + 'px';
  $('hint').style.top = (GROUND + 34) * s + 'px';
}
addEventListener('resize', fit); fit();

/* ==========================================================
   4) WINDSHIELD SCREEN (rotating shop ads) + NEWS STRIP
   ========================================================== */
let slideIdx = 0;
$('slides').innerHTML = SHOPS.map((s, i) =>
  '<span class="slide' + (i === 0 ? ' on' : '') + '"><span class="ico">' + icon(s.icon, 20) + '</span><span><small>' + esc(s.tag) + '</small><b>' + esc(s.name) + '</b><i>' + esc(s.where) + '</i></span></span>'
).join('');
setInterval(() => {
  const els = $('slides').children;
  els[slideIdx].classList.remove('on');
  slideIdx = (slideIdx + 1) % els.length;
  els[slideIdx].classList.add('on');
}, 4500);

const tickerText = NEWS.map(n => esc(n.text)).join('      •      ');
$('track').innerHTML = tickerText;
$('track').style.setProperty('--dur', Math.max(12, tickerText.length * 0.32) + 's');
$('shopCount').textContent = SHOPS.length;

/* ==========================================================
   5) SHEETS
   ========================================================== */
let lastFocus = null;
function openSheet(title, html) {
  lastFocus = document.activeElement;
  $('shTitle').textContent = title;
  $('shBody').innerHTML = html;
  $('shBody').scrollTop = 0;
  $('veil').classList.add('open');
  $('sheet').classList.add('open');
  $('sheet').setAttribute('aria-hidden', 'false');
  $('shClose').focus();
}
function closeSheet() {
  $('veil').classList.remove('open');
  $('sheet').classList.remove('open');
  $('sheet').setAttribute('aria-hidden', 'true');
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
$('shClose').onclick = closeSheet;
$('veil').onclick = closeSheet;
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function shopDetail(i) {
  const s = SHOPS[i];
  openSheet(s.name,
    '<div class="tile big">' + icon(s.icon, 28) + '</div>' +
    '<span class="chip">' + esc(s.cat) + ' · ' + esc(s.where) + '</span>' +
    '<p><b>' + esc(s.tag) + '</b></p>' +
    '<p>' + esc(s.offer) + '</p>' +
    '<p class="muted">عرض تجريبي لشرح الفكرة.</p>' +
    '<button class="btn ghost" id="allShops">كل المحلات على الخط</button>');
  $('allShops').onclick = shopsList;
}
function shopsList() {
  openSheet('محلات عالخط',
    '<p class="muted">المحلات اللي على طريق باص 16 من قرنايل لبحمدون.</p>' +
    SHOPS.map((s, i) =>
      '<button class="row" data-i="' + i + '"><span class="tile">' + icon(s.icon, 22) + '</span><span><b>' + esc(s.name) + '</b><small>' + esc(s.cat) + ' · ' + esc(s.where) + '</small></span><span class="go">' + icon('chev', 20) + '</span></button>'
    ).join('') +
    '<p class="muted" style="margin-top:14px">عندك محل على الخط؟ قريباً بتقدر تنضم وتطلع على شاشة الباص.</p>');
  $('shBody').querySelectorAll('.row').forEach(b => b.onclick = () => shopDetail(+b.dataset.i));
}
function newsList() {
  openSheet('أخبار الخط',
    '<p class="muted">أخبار الطريق من سواقين باص 16.</p>' +
    NEWS.map(n => '<div class="nrow"><span class="dot"></span><div><b>' + esc(n.text) + '</b><span class="muted">' + ago(n.min) + '</span></div></div>').join('') +
    '<p class="muted" style="margin-top:14px">قريباً: السواقين بيبعتوا الخبر من التطبيق وبيطلع هون مباشرة.</p>');
}
function gameInfo() {
  openSheet('لعبة 16',
    '<div class="tile big">' + icon('game', 28) + '</div><span class="chip">قريباً</span>' +
    '<ul class="plain"><li>اجمع نقاط كل ما تركب الباص.</li><li>بدّل نقاطك وفوز بمشوار مجاني.</li></ul>' +
    '<p class="muted">اللعبة قيد التحضير.</p>');
}
function villageInfo() {
  openSheet('ضيعتنا',
    '<div class="tile big">' + icon('village', 28) + '</div><span class="chip">قريباً</span>' +
    '<p>فعاليات وأخبار الضيَع اللي على الخط، بالتعاون مع البلديات.</p>' +
    '<p class="muted">القسم قيد التحضير.</p>');
}

$('adBtn').onclick = () => shopDetail(slideIdx);
$('newsBtn').onclick = newsList;
$('gameBtn').onclick = gameInfo;
$('villageBtn').onclick = villageInfo;
$('shopsBtn').onclick = shopsList;
$('whereBtn').onclick = () => { location.href = MAP_PAGE; };
</script>
</body>
</html>
